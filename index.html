<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calarea">
        <div class="expression">
            <p>0</p>
        </div>
        <div class="currentNum">
            <p>0</p>
        </div>

    </div>
    <div class="keys">
        <div class="num">
            <button>%</button>
        </div>
        <div class="num">
            <button>CE</button>
        </div>
        <div class="num">
            <button>C</button>
        </div>
        <div class="num">
            <button>Del</button>
        </div>
        <div class="num">
            <button>1/x</button>
        </div>
        <div class="num">
            <button> x<sup>2</sup></button>
        </div>
        <div class="num">
            <button>√</button>
        </div>
        <div class="num">
            <button>÷</button>
        </div>
        <div class="num">
            <button>7</button>
        </div>
        <div class="num">
            <button>8</button>
        </div>
        <div class="num">
            <button>9</button>
        </div>
        <div class="num">
            <button>X</button>
        </div>
        <div class="num">
            <button>4</button>
        </div>
        <div class="num">
            <button>5</button>
        </div>
        <div class="num">
            <button>6</button>
        </div>
        <div class="num">
            <button>-</button>
        </div>
        <div class="num">
            <button>1</button>
        </div>
        <div class="num">
            <button>2</button>
        </div>
        <div class="num">
            <button>3</button>
        </div>
        <div class="num">
            <button>+</button>
        </div>
        <div class="num">
            <button>+/-</button>
        </div>
        <div class="num">
            <button>0</button>
        </div>
        <div class="num">
            <button>.</button>
        </div>
        <div class="num">
            <button id="eq">=</button>
        </div>
    </div>
</body>

</html>
